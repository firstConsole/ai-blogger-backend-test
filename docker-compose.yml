name: ai-blogger

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES__USER:-ai_blogger}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD:?заполните POSTGRES__PASSWORD в .env (см. .env.example)}
      POSTGRES_DB: ${POSTGRES__DATABASE:-ai_blogger}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "127.0.0.1:${POSTGRES__PORT:-5432}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 1s

    user: "postgres"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp

    shm_size: 256mb

    stop_grace_period: 30s

    networks: [ai-blogger-backend]

  redis:
    image: redis:8.8.2
    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS__PASSWORD:?заполните REDIS__PASSWORD в .env}
      - --appendonly
      - "yes"
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - noeviction

    environment:
      REDISCLI_AUTH: ${REDIS__PASSWORD:?заполните REDIS__PASSWORD в .env}

    ports:
      - "127.0.0.1:${REDIS__PORT:-6379}:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s

    user: "redis"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 256m

    networks: [ai-blogger-backend]

volumes:
  postgres-data:
  redis-data:

networks:
  ai-blogger-backend:
    driver: bridge
